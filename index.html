<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello Natty</title>
  <style>
    :root { --bg: #f7f7f8; --fg: #1a1a1a; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #121212; --fg: #f2f2f2; }
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, sans-serif;
    }
    h1 { font-size: clamp(2rem, 8vw, 4rem); }
  </style>
</head>
<body>
  <h1>Hello Natty</h1>
</body>
</html>
